<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpine Local Server recovery</title><link rel="stylesheet" href="style.css"></head><body><aside><h1>ALPINE</h1><p>Local Server</p></aside><main><h2>সার্ভারের পর্দা পুনরায় খুলুন</h2><p>আগের সেটআপ ও ডাটাবেজ রাখা আছে। নতুন Owner setup করবেন না।</p><p id="recovery-message" role="status">সংযোগ পরীক্ষা হচ্ছে…</p><div class="actions"><button id="reload">পর্দা আবার খুলুন</button><button id="retry">সার্ভার পুনরায় চালু করুন</button><button id="folder" class="secondary">সার্ভারের ফোল্ডার</button><button id="exit" class="secondary">Stop and exit</button></div><p>কোনো বাটন কাজ না করলে Ctrl + Shift + Esc দিয়ে Task Manager খুলে Alpine Local Server বন্ধ করুন এবং বর্তমান সংস্করণ আবার ইনস্টল করুন।</p></main><script src="recovery.js"></script></body></html>
