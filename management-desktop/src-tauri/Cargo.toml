[package]
name = "alpine-owner-admin"
version = "1.0.0"
description = "Alpine Restaurant Owner and Admin desktop workspace"
authors = ["Alpine Restaurant"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
